services:
  - type: web
    name: copet
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      # Add these in the Render dashboard (do not commit secrets):
      # SUPABASE_URL=https://xxxx.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY=eyJ...
