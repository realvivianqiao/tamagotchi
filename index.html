<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOCHI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1a2e;
      --pink: #ff99b4;
      --pink-face: #ffb3c7;
      --sky: #c4e7ff;
      --white: #ffffff;
      --text: #1a1a2e;
      --muted: #3a3a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #e8e8ef;
      color: var(--text);
      font-family: Inter, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem 3rem;
    }
    .frame {
      width: min(420px, 100%);
      border: 5px solid var(--ink);
      background: var(--white);
      box-shadow: 8px 8px 0 var(--ink);
    }
    .art {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-bottom: 5px solid var(--ink);
      background: var(--sky);
    }
    .panel {
      padding: 1.1rem 1rem 1.35rem;
      text-align: center;
      background: var(--white);
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 1.1rem;
    }
    .tag {
      font-family: "Press Start 2P", monospace;
      font-size: 0.48rem;
      line-height: 1;
      color: var(--ink);
      background: var(--white);
      border: 3px solid var(--ink);
      padding: 0.45rem 0.4rem 0.35rem;
      text-transform: lowercase;
    }
    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(1.6rem, 8vw, 2.15rem);
      letter-spacing: 0.04em;
      margin: 0 0 0.95rem;
      color: var(--pink-face);
      text-shadow: 4px 4px 0 #5b2b6b;
      line-height: 1.15;
    }
    .lede {
      margin: 0 auto 1.25rem;
      max-width: 22rem;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 400;
    }
    .cta {
      display: inline-block;
      font-family: "Press Start 2P", monospace;
      font-size: 0.62rem;
      line-height: 1.35;
      text-decoration: none;
      color: var(--ink);
      background: var(--pink);
      border: 4px solid var(--ink);
      padding: 0.95rem 0.9rem 0.85rem;
      box-shadow: 4px 4px 0 var(--ink);
      text-transform: none;
    }
    .cta:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .cta:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--ink);
    }
    .meta {
      margin: 0.85rem 0 0;
      font-size: 0.72rem;
      color: #777;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="art" src="/pets.png" alt="Pixel dog, cat, and tiger" width="840" height="472" />
    <div class="panel">
      <div class="tags">
        <span class="tag">dogs</span>
        <span class="tag">cats</span>
        <span class="tag">tigers</span>
        <span class="tag">&amp; friends</span>
      </div>
      <h1>MOCHI</h1>
      <p class="lede">Tiny pets that live on your Mac. Invite someone, and when you feed or pet them, they see it happen on their screen.</p>
      <a class="cta" href="/Mochi.zip">Download for Mac</a>
      <p class="meta">unzip → open Mochi.app · first time: right‑click → Open</p>
    </div>
  </div>
</body>
</html>
